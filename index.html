        "email": "contato@gruposj.com.br",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Portugal, 6759",
          "addressLocality": "Umuarama",
          "addressRegion": "PR",
          "postalCode": "87501-160",
